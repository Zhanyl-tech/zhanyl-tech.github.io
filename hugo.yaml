baseURL: "https://zhanyl-tech.github.io/"
title: "Zhanyl Abdybaeva"
paginate: 10
theme: PaperMod
languageCode: en-us

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "Zhanyl Abdybaeva"
  description: "Senior HPC & ML Infrastructure Engineer | MS CS (GT) + CQF | Building production AI systems for quantitative trading"
  keywords: [ML Infrastructure, HPC, GPU Inference, Quantitative Finance, Distributed Training, CUDA]
  author: "Zhanyl Abdybaeva"
  DateFormat: "January 2, 2006"
  defaultTheme: dark
  disableThemeToggle: true

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    disableHLJS: true
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/safari-pinned-tab.svg"

  label:
    text: "Zhanyl Abdybaeva"
    icon: /images/logo.svg
    iconHeight: 30

  # Profile mode — used by custom index.html for avatar + bio
  profileMode:
    enabled: false
    title: "Zhanyl Abdybaeva"
    subtitle: "Senior HPC & ML Infrastructure Engineer"
    imageUrl: "/images/avatar.jpg"
    imageWidth: 80
    imageHeight: 80
    imageTitle: "Zhanyl Abdybaeva"

  subtitle: "Senior HPC & ML Infrastructure Engineer"

  # Homepage facts strip. These appear publicly — edit the wording here rather
  # than in the template. Kept qualitative on purpose: no invented metrics.
  facts:
    - label: "Role"
      value: 'Infrastructure engineering at a <span class="dim">quantitative trading firm</span>'
    - label: "Focus"
      value: 'GPU clusters · inference · <span class="dim">Slurm at scale</span>'
    - label: "Studying"
      value: 'MS CS — ML @ Georgia Tech<br><span class="dim">CQF</span>'
    - label: "Writing"
      value: 'Deep dives &amp; lab notes<br><span class="dim">most weeks</span>'

  socialIcons:
    - name: github
      url: "https://github.com/Zhanyl-tech"
    - name: linkedin
      url: "https://www.linkedin.com/in/za-engineering/"
    - name: x
      url: "https://x.com/ZhanylAbd"
    - name: rss
      url: "/index.xml"

  # Adds twitter:site / twitter:creator to every page, so shared links are
  # attributed back to the account.
  social:
    twitter: "ZhanylAbd"

  # Search
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  editPost:
    URL: ""
    Text: ""

outputs:
  home:
    - HTML
    - RSS
    - JSON

menu:
  main:
    - identifier: blog
      name: Blog
      url: /blog/
      weight: 10
    - identifier: experiments
      name: Lab Notes
      url: /experiments/
      weight: 20
    - identifier: notes
      name: Notes
      url: /notes/
      weight: 25
    - identifier: projects
      name: Projects
      url: /projects/
      weight: 30
    - identifier: reading
      name: Reading
      url: /reading/
      weight: 40
    - identifier: about
      name: About
      url: /about/
      weight: 50
    - identifier: search
      name: Search
      url: /search/
      weight: 60

taxonomies:
  category: categories
  tag: tags
  series: series

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    anchorLineNos: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: github-dark
