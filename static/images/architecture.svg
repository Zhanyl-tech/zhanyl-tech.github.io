<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img"
     aria-label="Architecture: an agentic operations layer diagnosing the Slurm control plane, with seven open-source tools attached to the stages they act on.">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono','SF Mono',Menlo,Consolas,monospace; }
      .t-title  { font-size: 26px; font-weight: 600; fill: #e9eff5; letter-spacing: 0.5px; }
      .t-sub    { font-size: 13px; fill: #828c98; }
      .t-band   { font-size: 11px; fill: #7d8894; letter-spacing: 2.2px; }
      .t-node   { font-size: 13px; font-weight: 500; fill: #e9eff5; }
      .t-desc   { font-size: 10.5px; fill: #98a3b0; }
      .t-chain  { font-size: 12px; font-weight: 500; fill: #cdd6df; }
      .t-edge   { font-size: 10px; fill: #7d8894; letter-spacing: 0.6px; }
      .t-mark   { font-size: 30px; font-weight: 500; fill: #f5b544; }
      .t-mark-s { font-size: 15px; font-weight: 500; fill: #f5b544; }
    </style>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#58a6ff"/>
    </marker>
    <marker id="ar-a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#f5b544"/>
    </marker>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#f5b544" stop-opacity="0.00"/>
      <stop offset="50%"  stop-color="#f5b544" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f5b544" stop-opacity="0.00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" rx="14" fill="#141a23"/>
  <rect x="0.5" y="0.5" width="1199" height="599" rx="14" fill="none" stroke="#243040"/>

  <!-- ── header ─────────────────────────────────────────────────────── -->
  <text class="mono t-mark" x="42" y="58">18</text>
  <text class="mono t-mark-s" x="76" y="46">∞</text>
  <text class="mono t-title" x="104" y="56">ML platforms, and the agents that operate them</text>
  <text class="mono t-sub" x="104" y="78">GPU cluster infrastructure · Slurm · Kubernetes · agentic operations</text>
  <rect x="42" y="98" width="1116" height="1" fill="url(#glow)"/>

  <!-- ── band 1: agentic operations ─────────────────────────────────── -->
  <text class="mono t-band" x="42" y="132">AGENTIC OPERATIONS</text>

  <g>
    <rect x="222" y="146" width="290" height="60" rx="8" fill="#1b2431" stroke="#f5b544" stroke-opacity="0.55"/>
    <text class="mono t-node" x="240" y="172">slurm-rca-bench</text>
    <text class="mono t-desc" x="240" y="190">10 scenarios · 2 undiagnosable · partial credit</text>
  </g>

  <g>
    <rect x="688" y="146" width="290" height="60" rx="8" fill="#1b2431" stroke="#f5b544" stroke-opacity="0.55"/>
    <text class="mono t-node" x="706" y="172">cluster-sre-agent</text>
    <text class="mono t-desc" x="706" y="190">5 ablatable configs · A → E</text>
  </g>

  <line x1="512" y1="176" x2="682" y2="176" stroke="#f5b544" stroke-opacity="0.7" stroke-width="1.4" marker-end="url(#ar-a)"/>
  <text class="mono t-edge" x="556" y="168">scores</text>

  <!-- diagnosis arrow down into the control plane -->
  <line x1="833" y1="206" x2="833" y2="268" stroke="#f5b544" stroke-opacity="0.45" stroke-width="1.2"
        stroke-dasharray="4 4" marker-end="url(#ar-a)"/>
  <text class="mono t-edge" x="845" y="242">diagnoses</text>

  <!-- ── band 2: slurm control plane ─────────────────────────────────── -->
  <text class="mono t-band" x="42" y="300">SLURM CONTROL PLANE — small, static, identical at every site</text>

  <g>
    <rect x="42" y="316" width="1116" height="74" rx="10" fill="#111823" stroke="#243040"/>

    <rect x="66"  y="338" width="176" height="32" rx="6" fill="#16202c" stroke="#2c3a4c"/>
    <text class="mono t-chain" x="94"  y="359">shared FS</text>

    <rect x="278" y="338" width="176" height="32" rx="6" fill="#16202c" stroke="#2c3a4c"/>
    <text class="mono t-chain" x="300" y="359">accounting DB</text>

    <rect x="490" y="338" width="176" height="32" rx="6" fill="#16202c" stroke="#2c3a4c"/>
    <text class="mono t-chain" x="528" y="359">slurmdbd</text>

    <rect x="702" y="338" width="176" height="32" rx="6" fill="#16202c" stroke="#2c3a4c"/>
    <text class="mono t-chain" x="738" y="359">slurmctld</text>

    <rect x="914" y="338" width="220" height="32" rx="6" fill="#16202c" stroke="#2c3a4c"/>
    <text class="mono t-chain" x="962" y="359">scheduling</text>

    <line x1="242" y1="354" x2="272" y2="354" stroke="#58a6ff" stroke-width="1.3" marker-end="url(#ar)"/>
    <line x1="454" y1="354" x2="484" y2="354" stroke="#58a6ff" stroke-width="1.3" marker-end="url(#ar)"/>
    <line x1="666" y1="354" x2="696" y2="354" stroke="#58a6ff" stroke-width="1.3" marker-end="url(#ar)"/>
    <line x1="878" y1="354" x2="908" y2="354" stroke="#58a6ff" stroke-width="1.3" marker-end="url(#ar)"/>
  </g>

  <!-- measured-refutation callout -->
  <text class="mono t-desc" x="42" y="412" fill="#f5b544">
    measured: a stalled accounting path does NOT halt scheduling — the folk model is wrong
  </text>

  <!-- ── band 3: the tools ──────────────────────────────────────────── -->
  <text class="mono t-band" x="42" y="452">OPEN SOURCE — the lifecycle of a GPU allocation</text>


  <g>
    <rect x="42" y="466" width="200" height="72" rx="8" fill="#1b2431" stroke="#3fb950" stroke-opacity="0.40"/>
    <text class="mono t-node" x="58" y="492">scheduler-lab</text>
    <text class="mono t-desc" x="58" y="510">policy, before it ships</text>
    <text class="mono t-desc" x="58" y="526" fill="#3fb950">util 72.2% → 83.6%</text>
  </g>

  <g>
    <rect x="264" y="466" width="200" height="72" rx="8" fill="#1b2431" stroke="#3fb950" stroke-opacity="0.40"/>
    <text class="mono t-node" x="280" y="492">gpu-reaper</text>
    <text class="mono t-desc" x="280" y="510">waste during a job</text>
    <text class="mono t-desc" x="280" y="526" fill="#3fb950">observe by default</text>
  </g>

  <g>
    <rect x="486" y="466" width="200" height="72" rx="8" fill="#1b2431" stroke="#3fb950" stroke-opacity="0.40"/>
    <text class="mono t-node" x="502" y="492">ib-slurm-exporter</text>
    <text class="mono t-desc" x="502" y="510">fabric → the job</text>
    <text class="mono t-desc" x="502" y="526" fill="#3fb950">InfiniBand / RoCE</text>
  </g>

  <g>
    <rect x="708" y="466" width="200" height="72" rx="8" fill="#1b2431" stroke="#3fb950" stroke-opacity="0.40"/>
    <text class="mono t-node" x="724" y="492">epilog-validator</text>
    <text class="mono t-desc" x="724" y="510">faults between jobs</text>
    <text class="mono t-desc" x="724" y="526" fill="#3fb950">never on ignorance</text>
  </g>

  <g>
    <rect x="930" y="466" width="228" height="72" rx="8" fill="#1b2431" stroke="#3fb950" stroke-opacity="0.40"/>
    <text class="mono t-node" x="946" y="492">slinky-gitops</text>
    <text class="mono t-desc" x="946" y="510">Slurm on Kubernetes</text>
    <text class="mono t-desc" x="946" y="526" fill="#3fb950">auth-key rotation</text>
  </g>

  <text class="mono t-desc" x="42" y="568" fill="#7d8894">
    one rule throughout — never act on absent evidence · a telemetry gap is a collector fault, not an idle GPU
  </text>
</svg>
