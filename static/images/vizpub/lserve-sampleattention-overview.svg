<svg width="1600" height="1100" viewBox="0 0 1600 1100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="1100" fill="#FCFCFA"/>
  <text x="100" y="96" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="700">Sparse Attention for Long-Context Serving</text>
  <text x="100" y="136" fill="#555555" font-family="Inter, Arial, sans-serif" font-size="22">LServe explains the serving-system realization. SampleAttention explains the runtime sparse structure.</text>

  <rect x="100" y="190" width="1400" height="120" rx="28" fill="#F4F1EA" stroke="#DDD6C8"/>
  <text x="135" y="238" fill="#7A5C1E" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Shared Thesis</text>
  <text x="135" y="278" fill="#1B1B1B" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600">The win comes from structured sparsity that kernels can exploit cheaply.</text>
  <text x="135" y="316" fill="#4D4D4D" font-family="Inter, Arial, sans-serif" font-size="21">Not arbitrary dropped scores. Not a fixed global sparsity ratio. The shape of sparsity matters.</text>

  <rect x="100" y="360" width="670" height="640" rx="32" fill="#F6F9FF" stroke="#C8D7FF"/>
  <text x="136" y="414" fill="#2345B8" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">LServe: System Design Across Both Phases</text>
  <text x="136" y="450" fill="#4D5B84" font-family="Inter, Arial, sans-serif" font-size="20">Optimization target changes when you move from prefilling to decoding.</text>

  <rect x="136" y="488" width="598" height="190" rx="24" fill="#FFFFFF" stroke="#D9E4FF"/>
  <text x="164" y="530" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Prefill</text>
  <text x="164" y="568" fill="#222222" font-family="Inter, Arial, sans-serif" font-size="21">1. Partition KV history into blocks.</text>
  <text x="164" y="602" fill="#222222" font-family="Inter, Arial, sans-serif" font-size="21">2. Skip older low-value blocks entirely.</text>
  <text x="164" y="636" fill="#222222" font-family="Inter, Arial, sans-serif" font-size="21">3. Convert about half the heads into cheap streaming heads.</text>
  <text x="164" y="670" fill="#555555" font-family="Inter, Arial, sans-serif" font-size="19">Goal: reduce sequential KV iterations in the attention kernel.</text>

  <rect x="136" y="716" width="598" height="230" rx="24" fill="#FFFFFF" stroke="#D9E4FF"/>
  <text x="164" y="758" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Decode</text>
  <text x="164" y="796" fill="#222222" font-family="Inter, Arial, sans-serif" font-size="21">1. Treat KV cache as pages.</text>
  <text x="164" y="830" fill="#222222" font-family="Inter, Arial, sans-serif" font-size="21">2. Score which pages matter for the current query.</text>
  <text x="164" y="864" fill="#222222" font-family="Inter, Arial, sans-serif" font-size="21">3. Read only selected pages, then combine with KV quantization.</text>
  <text x="164" y="898" fill="#555555" font-family="Inter, Arial, sans-serif" font-size="19">Goal: cut memory-bound KV access while preserving long-context behavior.</text>

  <path d="M793 520H866" stroke="#9FB6FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M853 508L873 520L853 532" stroke="#9FB6FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M793 824H866" stroke="#9FB6FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M853 812L873 824L853 836" stroke="#9FB6FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="830" y="360" width="670" height="640" rx="32" fill="#FFF8F1" stroke="#F0D3AE"/>
  <text x="866" y="414" fill="#B86716" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">SampleAttention: Runtime Sparse Structure</text>
  <text x="866" y="450" fill="#8A6A46" font-family="Inter, Arial, sans-serif" font-size="20">The dominant sparse pattern changes by head, prompt, and model, but two shapes recur.</text>

  <rect x="866" y="488" width="282" height="230" rx="24" fill="#FFFFFF" stroke="#F3DFC6"/>
  <text x="894" y="530" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Column Pattern</text>
  <rect x="894" y="556" width="226" height="112" rx="16" fill="#FFF4E8"/>
  <line x1="964" y1="568" x2="964" y2="656" stroke="#E08A2E" stroke-width="12" stroke-linecap="round"/>
  <line x1="1038" y1="568" x2="1038" y2="656" stroke="#E08A2E" stroke-width="12" stroke-linecap="round"/>
  <text x="894" y="694" fill="#555555" font-family="Inter, Arial, sans-serif" font-size="19">Semantic role: global anchors and attention sinks.</text>

  <rect x="1182" y="488" width="282" height="230" rx="24" fill="#FFFFFF" stroke="#F3DFC6"/>
  <text x="1210" y="530" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Slash Pattern</text>
  <rect x="1210" y="556" width="226" height="112" rx="16" fill="#FFF4E8"/>
  <line x1="1248" y1="648" x2="1338" y2="568" stroke="#E08A2E" stroke-width="12" stroke-linecap="round"/>
  <line x1="1302" y1="648" x2="1392" y2="568" stroke="#E08A2E" stroke-width="12" stroke-linecap="round"/>
  <text x="1210" y="694" fill="#555555" font-family="Inter, Arial, sans-serif" font-size="19">Semantic role: local continuity and recent context.</text>

  <rect x="866" y="760" width="598" height="186" rx="24" fill="#FFFFFF" stroke="#F3DFC6"/>
  <text x="894" y="802" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">CRA: Accuracy Proxy</text>
  <text x="894" y="840" fill="#222222" font-family="Inter, Arial, sans-serif" font-size="21">CRA = minimum remaining attention probability mass per query after sparsification.</text>
  <text x="894" y="876" fill="#222222" font-family="Inter, Arial, sans-serif" font-size="21">Higher CRA means the sparse mask retained more useful attention mass.</text>
  <text x="894" y="912" fill="#555555" font-family="Inter, Arial, sans-serif" font-size="19">SampleAttention approximates CRA with query-guided chunked sampling, then selects top-k column and slash blocks.</text>

  <rect x="100" y="1030" width="1400" height="32" rx="16" fill="#F1F1ED"/>
  <text x="126" y="1052" fill="#555555" font-family="Inter, Arial, sans-serif" font-size="18">Mental model: SampleAttention explains what to keep in prefill; LServe explains how to serve sparse attention efficiently across prefill and decode.</text>
</svg>
