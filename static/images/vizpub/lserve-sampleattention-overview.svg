    <rect x="840" y="282" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="868" y="282" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="896" y="282" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="784" y="310" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="812" y="310" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="840" y="310" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="868" y="310" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="896" y="310" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="784" y="338" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="812" y="338" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="840" y="338" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="868" y="338" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="896" y="338" width="22" height="22" rx="3" fill="#F9A825"/>
  </g>
  <rect x="784" y="250" width="22" height="114" rx="3" fill="#E65100" opacity="0.9"/>
  <rect x="840" y="250" width="22" height="114" rx="3" fill="#E65100" opacity="0.9"/>
  <text x="853" y="382" fill="#4E342E" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">Global anchors</text>

  <!-- slash grid -->
  <rect x="960" y="218" width="170" height="170" rx="12" fill="#FFFFFF" stroke="#FFD54F"/>
  <text x="1045" y="244" fill="#E65100" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">SLASH</text>
  <g opacity="0.25">
    <rect x="976" y="254" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="1004" y="254" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="1032" y="254" width="22" height="22" rx="3" fill="#F9A825"/>
