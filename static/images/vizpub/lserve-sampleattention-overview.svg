    <rect x="1088" y="338" width="22" height="22" rx="3" fill="#F9A825"/>
  </g>
  <!-- diagonal cells -->
  <rect x="976" y="338" width="22" height="22" rx="3" fill="#E65100" opacity="0.9"/>
  <rect x="1004" y="310" width="22" height="22" rx="3" fill="#E65100" opacity="0.9"/>
  <rect x="1032" y="282" width="22" height="22" rx="3" fill="#E65100" opacity="0.9"/>
  <rect x="1060" y="254" width="22" height="22" rx="3" fill="#E65100" opacity="0.9"/>
  <text x="1045" y="382" fill="#4E342E" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">Local continuity</text>

  <rect x="768" y="400" width="2" height="0" fill="transparent"/>
  <text x="768" y="420" fill="#555555" font-family="Inter,Arial,sans-serif" font-size="16">Column = globally important tokens (sinks). Slash = nearby tokens (recency).</text>

  <rect x="768" y="428" width="556" height="2" fill="#FFE082"/>

  <!-- CRA section -->
  <text x="768" y="462" fill="#E65100" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">② CRA: Quality Signal for the Sparse Mask</text>
  <text x="768" y="494" fill="#4E342E" font-family="Inter,Arial,sans-serif" font-size="16">Cumulative Residual Attention = fraction of total attention mass</text>
  <text x="768" y="516" fill="#4E342E" font-family="Inter,Arial,sans-serif" font-size="16">retained after masking. Proxy for model accuracy.</text>

  <!-- CRA bar -->
  <rect x="768" y="534" width="400" height="20" rx="10" fill="#FFE0B2"/>
  <rect x="768" y="534" width="320" height="20" rx="10" fill="#E65100"/>
  <text x="1096" y="550" fill="#555" font-family="Inter,Arial,sans-serif" font-size="15">100%</text>
  <text x="768" y="576" fill="#4E342E" font-family="Inter,Arial,sans-serif" font-size="15">High CRA → mask is good → accuracy preserved</text>
  <text x="768" y="598" fill="#4E342E" font-family="Inter,Arial,sans-serif" font-size="15">Estimated at runtime from sampled Q rows — no offline tuning.</text>

  <!-- gains badge -->
  <rect x="768" y="634" width="556" height="40" rx="12" fill="#F9A825"/>
  <text x="1046" y="660" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">Up to 2.42× TTFT vs FlashAttention-2</text>

  <!-- bottom bar -->
  <rect x="0" y="762" width="1400" height="38" fill="#F0F0F0"/>
  <text x="40" y="786" fill="#888888" font-family="Inter,Arial,sans-serif" font-size="15">LServe: arxiv 2502.14866 · SampleAttention: arxiv 2406.15486 · zhanyl-tech.github.io</text>
