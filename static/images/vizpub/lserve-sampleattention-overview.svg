<svg width="1400" height="800" viewBox="0 0 1400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="800" fill="#FAFAFA"/>

  <!-- header -->
  <rect width="1400" height="88" fill="#1A2B6D"/>
  <text x="48" y="52" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">PAPER OVERVIEW</text>
  <text x="48" y="78" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">LServe + SampleAttention: Sparse Attention for Long-Context LLM Serving</text>

  <!-- ── LServe card ── -->
  <rect x="40" y="112" width="630" height="576" rx="20" fill="#E8F0FE" stroke="#4285F4" stroke-width="2"/>
  <rect x="40" y="112" width="630" height="52" rx="20" fill="#4285F4"/>
  <rect x="40" y="140" width="630" height="24" fill="#4285F4"/>
  <text x="80" y="147" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">LServe — Serving-System View</text>

  <!-- prefill section -->
  <text x="80" y="202" fill="#1A237E" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">① PREFILL: Block-Sparse + Streaming Heads</text>

  <!-- KV blocks row with skipped shown -->
  <text x="80" y="236" fill="#555555" font-family="Inter,Arial,sans-serif" font-size="16">KV history  →  skip non-essential blocks</text>
  <rect x="80"  y="248" width="40" height="32" rx="6" fill="#4285F4"/>
  <rect x="126" y="248" width="40" height="32" rx="6" fill="#BBDEFB"/>
  <rect x="172" y="248" width="40" height="32" rx="6" fill="#4285F4"/>
  <rect x="218" y="248" width="40" height="32" rx="6" fill="#BBDEFB"/>
  <rect x="264" y="248" width="40" height="32" rx="6" fill="#BBDEFB"/>
  <rect x="310" y="248" width="40" height="32" rx="6" fill="#4285F4"/>
  <rect x="356" y="248" width="40" height="32" rx="6" fill="#BBDEFB"/>
  <rect x="402" y="248" width="40" height="32" rx="6" fill="#4285F4"/>
  <rect x="460" y="252" width="16" height="16" rx="4" fill="#4285F4"/>
  <text x="482" y="268" fill="#333" font-family="Inter,Arial,sans-serif" font-size="15">computed</text>
  <rect x="460" y="276" width="16" height="16" rx="4" fill="#BBDEFB"/>
  <text x="482" y="292" fill="#333" font-family="Inter,Arial,sans-serif" font-size="15">skipped</text>

  <!-- streaming heads -->
  <text x="80" y="318" fill="#555555" font-family="Inter,Arial,sans-serif" font-size="16">50% of heads → Λ-mask (sink tokens + local window only)</text>
  <polygon points="80,330 180,330 180,360 80,360" fill="#BBDEFB" opacity="0.5"/>
  <polygon points="80,330 180,360 80,360" fill="#4285F4" opacity="0.7"/>
  <rect x="80" y="330" width="18" height="30" rx="3" fill="#4285F4"/>
  <text x="200" y="352" fill="#1A237E" font-family="Inter,Arial,sans-serif" font-size="15">≈ free (sink + window, no dense compute)</text>

  <rect x="80" y="378" width="556" height="2" fill="#C5CAE9"/>

  <!-- decode section -->
  <text x="80" y="410" fill="#1A237E" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">② DECODE: Hierarchical KV-Page Selection</text>
  <text x="80" y="440" fill="#555555" font-family="Inter,Arial,sans-serif" font-size="16">Per decode step: score all pages cheaply → read only top-k pages</text>

  <!-- 2-level selection visual -->
  <rect x="80" y="454" width="230" height="90" rx="12" fill="#C5CAE9" stroke="#3F51B5"/>
  <text x="195" y="492" fill="#1A237E" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle">Level 1</text>
  <text x="195" y="514" fill="#1A237E" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">Coarse: page summary</text>
  <text x="195" y="534" fill="#1A237E" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">O(n/page_size)</text>

  <path d="M318 498H378" stroke="#3F51B5" stroke-width="4" stroke-linecap="round"/>
  <path d="M364 486L384 498L364 510" stroke="#3F51B5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="384" y="454" width="230" height="90" rx="12" fill="#7986CB" stroke="#3F51B5"/>
  <text x="499" y="492" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle">Level 2</text>
  <text x="499" y="514" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">Fine: token-level in</text>
  <text x="499" y="534" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">selected pages only</text>

  <!-- INT4 KV -->
  <rect x="80" y="562" width="556" height="58" rx="12" fill="#E8EAF6" stroke="#5C6BC0"/>
  <text x="358" y="591" fill="#1A237E" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="middle">+ INT4 KV Quantization: halves every page read</text>
  <text x="358" y="611" fill="#3949AB" font-family="Inter,Arial,sans-serif" font-size="15" text-anchor="middle">Decode gains are multiplicative: sparsity × quantization</text>

  <!-- gains badge -->
  <rect x="80" y="634" width="556" height="40" rx="12" fill="#4285F4"/>
  <text x="358" y="660" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle">2.9× prefill speedup   ·   1.3–2.1× decode throughput vs vLLM</text>

  <!-- ── SampleAttention card ── -->
  <rect x="730" y="112" width="630" height="576" rx="20" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/>
  <rect x="730" y="112" width="630" height="52" rx="20" fill="#F9A825"/>
  <rect x="730" y="140" width="630" height="24" fill="#F9A825"/>
  <text x="768" y="147" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">SampleAttention — Sparse-Structure View</text>

  <!-- two patterns -->
  <text x="768" y="202" fill="#E65100" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">① Two Patterns Dominate Prefill Attention</text>

  <!-- column grid -->
  <rect x="768" y="218" width="170" height="170" rx="12" fill="#FFFFFF" stroke="#FFD54F"/>
  <text x="853" y="244" fill="#E65100" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">COLUMN</text>
  <!-- 5x5 grid with column highlight -->
  <g opacity="0.25">
    <rect x="784" y="254" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="812" y="254" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="840" y="254" width="22" height="22" rx="3" fill="#F9A825"/>
