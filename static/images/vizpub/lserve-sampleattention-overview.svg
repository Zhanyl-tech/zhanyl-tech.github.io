    <rect x="1060" y="282" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="1088" y="282" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="976" y="310" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="1004" y="310" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="1032" y="310" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="1060" y="310" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="1088" y="310" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="976" y="338" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="1004" y="338" width="22" height="22" rx="3" fill="#F9A825"/>
    <rect x="1032" y="338" width="22" height="22" rx="3" fill="#F9A825"/>
