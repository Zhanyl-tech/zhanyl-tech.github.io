  <text x="72" y="190" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="700">Sparse Attention</text>
  <text x="72" y="262" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="700">That Actually</text>
  <text x="72" y="334" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="700">Changes Serving</text>
  <text x="72" y="410" fill="#5E6470" font-family="Inter, Arial, sans-serif" font-size="30">LServe explains the serving path. SampleAttention explains the sparse structure.</text>

  <rect x="72" y="474" width="1056" height="156" rx="30" fill="#FFFFFF" stroke="#E5EBF7"/>
  <text x="110" y="526" fill="#6C5A28" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">SHARED THESIS</text>
  <text x="110" y="578" fill="#1B1B1B" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="600">The real win comes from structured sparsity</text>
  <text x="110" y="624" fill="#1B1B1B" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="600">that kernels can exploit cheaply.</text>

