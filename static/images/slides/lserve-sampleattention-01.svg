  <text x="694" y="878" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">The key claim</text>
  <text x="694" y="922" fill="#2F2F2F" font-family="Inter, Arial, sans-serif" font-size="22">Two recurring patterns explain</text>
  <text x="694" y="956" fill="#2F2F2F" font-family="Inter, Arial, sans-serif" font-size="22">much of the useful attention mass:</text>
  <text x="694" y="996" fill="#7A5B31" font-family="Inter, Arial, sans-serif" font-size="22">columns for global anchors, slashes for local continuity.</text>

