<svg width="1200" height="1500" viewBox="0 0 1200 1500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="1500" fill="#FFFFFF"/>

  <!-- header band -->
  <rect width="1200" height="140" fill="#1A2B6D"/>
  <text x="60" y="72" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">ML INFRASTRUCTURE · PAPER BREAKDOWN</text>
  <text x="60" y="112" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="50" font-weight="700">Sparse Attention for LLM Serving</text>

  <!-- label pill -->
  <rect x="60" y="168" width="238" height="40" rx="20" fill="#FFF3E0"/>
  <text x="88" y="194" fill="#E65100" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">TWO PAPERS, ONE IDEA</text>

  <text x="60" y="264" fill="#111111" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700">The win comes from structured sparsity</text>
  <text x="60" y="308" fill="#111111" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700">that kernels can exploit cheaply.</text>
  <text x="60" y="360" fill="#555555" font-family="Inter,Arial,sans-serif" font-size="24">Not arbitrary dropped scores. The shape of sparsity matters.</text>

  <!-- LServe card -->
  <rect x="60" y="404" width="510" height="620" rx="28" fill="#E8F0FE" stroke="#4285F4" stroke-width="2"/>
  <rect x="60" y="404" width="510" height="68" rx="28" fill="#4285F4"/>
  <rect x="60" y="438" width="510" height="34" fill="#4285F4"/>
  <text x="100" y="448" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">LServe</text>
  <text x="100" y="510" fill="#1A237E" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600">SERVING-SYSTEM VIEW</text>
  <text x="100" y="554" fill="#1A237E" font-family="Inter,Arial,sans-serif" font-size="22">Use different sparse mechanisms</text>
  <text x="100" y="584" fill="#1A237E" font-family="Inter,Arial,sans-serif" font-size="22">for different bottlenecks.</text>

  <!-- prefill mini diagram -->
  <rect x="100" y="620" width="390" height="90" rx="16" fill="#FFFFFF" stroke="#90CAF9"/>
  <text x="124" y="655" fill="#1A237E" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">PREFILL</text>
  <!-- kv blocks row -->
  <rect x="124" y="668" width="42" height="28" rx="6" fill="#4285F4"/>
  <rect x="172" y="668" width="42" height="28" rx="6" fill="#4285F4"/>
  <rect x="220" y="668" width="42" height="28" rx="6" fill="#BBDEFB"/>
  <rect x="268" y="668" width="42" height="28" rx="6" fill="#BBDEFB"/>
  <rect x="316" y="668" width="42" height="28" rx="6" fill="#4285F4"/>
  <rect x="364" y="668" width="42" height="28" rx="6" fill="#BBDEFB"/>
  <text x="424" y="690" fill="#555" font-family="Inter,Arial,sans-serif" font-size="18">Skip blocks</text>

  <!-- decode mini diagram -->
  <rect x="100" y="730" width="390" height="90" rx="16" fill="#FFFFFF" stroke="#90CAF9"/>
  <text x="124" y="765" fill="#1A237E" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">DECODE</text>
  <!-- kv pages -->
  <rect x="124" y="778" width="30" height="28" rx="6" fill="#E65100"/>
  <rect x="160" y="778" width="30" height="28" rx="6" fill="#FFE0B2"/>
  <rect x="196" y="778" width="30" height="28" rx="6" fill="#E65100"/>
  <rect x="232" y="778" width="30" height="28" rx="6" fill="#FFE0B2"/>
  <rect x="268" y="778" width="30" height="28" rx="6" fill="#E65100"/>
  <rect x="304" y="778" width="30" height="28" rx="6" fill="#FFE0B2"/>
  <path d="M352 792H390" stroke="#E65100" stroke-width="5" stroke-linecap="round"/>
  <path d="M376 780L396 792L376 804" stroke="#E65100" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="402" y="800" fill="#555" font-family="Inter,Arial,sans-serif" font-size="18">Select pages</text>

  <text x="100" y="880" fill="#1A237E" font-family="Inter,Arial,sans-serif" font-size="20">Gains are multiplicative: sparsity reduces</text>
  <text x="100" y="906" fill="#1A237E" font-family="Inter,Arial,sans-serif" font-size="20">page reads; quantization reduces each read.</text>

  <text x="100" y="966" fill="#1A237E" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600">Result: up to 2.9× prefill, 1.3–2.1× decode</text>
  <text x="100" y="994" fill="#1A237E" font-family="Inter,Arial,sans-serif" font-size="20">speedup vs vLLM on Llama-3-8B.</text>

  <!-- SampleAttention card -->
  <rect x="630" y="404" width="510" height="620" rx="28" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/>
  <rect x="630" y="404" width="510" height="68" rx="28" fill="#F9A825"/>
  <rect x="630" y="438" width="510" height="34" fill="#F9A825"/>
  <text x="670" y="448" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">SampleAttention</text>
  <text x="670" y="510" fill="#E65100" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600">SPARSE-STRUCTURE VIEW</text>
  <text x="670" y="554" fill="#4E342E" font-family="Inter,Arial,sans-serif" font-size="22">Two patterns explain most of the</text>
  <text x="670" y="584" fill="#4E342E" font-family="Inter,Arial,sans-serif" font-size="22">useful attention mass during prefill.</text>

  <!-- column pattern mini -->
  <rect x="670" y="620" width="186" height="148" rx="16" fill="#FFFFFF" stroke="#FFD54F"/>
  <text x="714" y="650" fill="#4E342E" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">COLUMN</text>
  <!-- mini attention grid -->
  <g opacity="0.3">
    <rect x="690" y="666" width="18" height="18" rx="3" fill="#F9A825"/>
    <rect x="714" y="666" width="18" height="18" rx="3" fill="#F9A825"/>
    <rect x="738" y="666" width="18" height="18" rx="3" fill="#F9A825"/>
    <rect x="762" y="666" width="18" height="18" rx="3" fill="#F9A825"/>
    <rect x="690" y="690" width="18" height="18" rx="3" fill="#F9A825"/>
    <rect x="714" y="690" width="18" height="18" rx="3" fill="#F9A825"/>
    <rect x="738" y="690" width="18" height="18" rx="3" fill="#F9A825"/>
    <rect x="762" y="690" width="18" height="18" rx="3" fill="#F9A825"/>
    <rect x="690" y="714" width="18" height="18" rx="3" fill="#F9A825"/>
    <rect x="714" y="714" width="18" height="18" rx="3" fill="#F9A825"/>
    <rect x="738" y="714" width="18" height="18" rx="3" fill="#F9A825"/>
    <rect x="762" y="714" width="18" height="18" rx="3" fill="#F9A825"/>
  </g>
  <!-- column highlights -->
  <rect x="700" y="660" width="18" height="80" rx="3" fill="#E65100" opacity="0.9"/>
  <rect x="748" y="660" width="18" height="80" rx="3" fill="#E65100" opacity="0.9"/>
  <text x="680" y="762" fill="#4E342E" font-family="Inter,Arial,sans-serif" font-size="15">Global anchors</text>

  <!-- slash pattern mini -->
  <rect x="876" y="620" width="186" height="148" rx="16" fill="#FFFFFF" stroke="#FFD54F"/>
  <text x="920" y="650" fill="#4E342E" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">SLASH</text>
  <!-- mini grid -->
  <g opacity="0.3">
    <rect x="896" y="666" width="18" height="18" rx="3" fill="#F9A825"/>
    <rect x="920" y="666" width="18" height="18" rx="3" fill="#F9A825"/>
    <rect x="944" y="666" width="18" height="18" rx="3" fill="#F9A825"/>
    <rect x="968" y="666" width="18" height="18" rx="3" fill="#F9A825"/>
    <rect x="896" y="690" width="18" height="18" rx="3" fill="#F9A825"/>
    <rect x="920" y="690" width="18" height="18" rx="3" fill="#F9A825"/>
    <rect x="944" y="690" width="18" height="18" rx="3" fill="#F9A825"/>
    <rect x="968" y="690" width="18" height="18" rx="3" fill="#F9A825"/>
    <rect x="896" y="714" width="18" height="18" rx="3" fill="#F9A825"/>
    <rect x="920" y="714" width="18" height="18" rx="3" fill="#F9A825"/>
    <rect x="944" y="714" width="18" height="18" rx="3" fill="#F9A825"/>
    <rect x="968" y="714" width="18" height="18" rx="3" fill="#F9A825"/>
  </g>
  <!-- diagonal highlights -->
  <rect x="896" y="714" width="18" height="18" rx="3" fill="#E65100" opacity="0.9"/>
  <rect x="920" y="690" width="18" height="18" rx="3" fill="#E65100" opacity="0.9"/>
  <rect x="944" y="666" width="18" height="18" rx="3" fill="#E65100" opacity="0.9"/>
  <rect x="968" y="642" width="18" height="18" rx="3" fill="#E65100" opacity="0.9"/>
  <text x="886" y="762" fill="#4E342E" font-family="Inter,Arial,sans-serif" font-size="15">Local continuity</text>

  <!-- CRA bar -->
  <rect x="670" y="800" width="422" height="100" rx="16" fill="#FFFFFF" stroke="#FFD54F"/>
  <text x="696" y="838" fill="#4E342E" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">CRA — accuracy guardrail</text>
  <rect x="696" y="852" width="370" height="18" rx="9" fill="#FFE0B2"/>
  <rect x="696" y="852" width="278" height="18" rx="9" fill="#E65100"/>
  <text x="984" y="866" fill="#555" font-family="Inter,Arial,sans-serif" font-size="14">100%</text>
  <text x="696" y="890" fill="#4E342E" font-family="Inter,Arial,sans-serif" font-size="17">Min retained attention mass per query</text>

  <text x="670" y="954" fill="#4E342E" font-family="Inter,Arial,sans-serif" font-size="20">Adapts sparsity per head and prompt at</text>
  <text x="670" y="982" fill="#4E342E" font-family="Inter,Arial,sans-serif" font-size="20">runtime. No offline profile required.</text>

  <text x="670" y="1002" fill="#555" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">Result: up to 2.42× TTFT vs FlashAttention.</text>

  <!-- bottom bar -->
  <rect x="0" y="1438" width="1200" height="62" fill="#F5F5F5"/>
  <text x="60" y="1477" fill="#888888" font-family="Inter,Arial,sans-serif" font-size="20">Slide 1 of 4</text>
  <text x="870" y="1477" fill="#888888" font-family="Inter,Arial,sans-serif" font-size="20">zhanyl-tech.github.io</text>
</svg>
