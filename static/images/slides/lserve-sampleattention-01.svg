  <text x="108" y="796" fill="#58647C" font-family="Inter, Arial, sans-serif" font-size="24">Serving-time view</text>
  <rect x="108" y="834" width="428" height="166" rx="24" fill="#FFFFFF" stroke="#DCE7FF"/>
  <text x="138" y="878" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Use different sparsity</text>
  <text x="138" y="914" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="24">for different bottlenecks:</text>
  <text x="138" y="958" fill="#2C3A57" font-family="Inter, Arial, sans-serif" font-size="22">Prefill skips KV blocks.</text>
  <text x="138" y="992" fill="#2C3A57" font-family="Inter, Arial, sans-serif" font-size="22">Decode prunes KV pages.</text>

