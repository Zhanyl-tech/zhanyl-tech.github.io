<svg width="1200" height="1500" viewBox="0 0 1200 1500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="1500" fill="#FBFAFF"/>
  <text x="72" y="112" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="700">SampleAttention: The Sparse</text>
  <text x="72" y="178" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="700">Patterns That Matter Most</text>
  <text x="72" y="244" fill="#5F6672" font-family="Inter, Arial, sans-serif" font-size="28">Its key contribution is not just sparsity. It is runtime-adaptive sparsity with an accuracy proxy.</text>

  <rect x="72" y="316" width="500" height="520" rx="34" fill="#FFF8F1" stroke="#F0D8BC"/>
  <text x="108" y="374" fill="#BA6814" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Column pattern</text>
  <text x="108" y="416" fill="#8B6B47" font-family="Inter, Arial, sans-serif" font-size="22">Global anchors and attention sinks</text>
  <rect x="108" y="454" width="428" height="212" rx="24" fill="#FFFFFF" stroke="#F3E3D0"/>
  <rect x="138" y="486" width="368" height="148" rx="18" fill="#FFF6EA"/>
  <line x1="222" y1="504" x2="222" y2="616" stroke="#E0882F" stroke-width="18" stroke-linecap="round"/>
  <line x1="306" y1="504" x2="306" y2="616" stroke="#E0882F" stroke-width="18" stroke-linecap="round"/>
  <line x1="390" y1="504" x2="390" y2="616" stroke="#F3CF9F" stroke-width="18" stroke-linecap="round"/>
  <text x="108" y="714" fill="#6D6257" font-family="Inter, Arial, sans-serif" font-size="22">Many queries still need the same important key positions.</text>
  <text x="108" y="748" fill="#6D6257" font-family="Inter, Arial, sans-serif" font-size="22">That is why a few columns can carry a lot of useful mass.</text>

  <rect x="628" y="316" width="500" height="520" rx="34" fill="#FFF8F1" stroke="#F0D8BC"/>
  <text x="664" y="374" fill="#BA6814" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Slash pattern</text>
  <text x="664" y="416" fill="#8B6B47" font-family="Inter, Arial, sans-serif" font-size="22">Local continuity and recent context</text>
  <rect x="664" y="454" width="428" height="212" rx="24" fill="#FFFFFF" stroke="#F3E3D0"/>
  <rect x="694" y="486" width="368" height="148" rx="18" fill="#FFF6EA"/>
  <line x1="742" y1="612" x2="854" y2="516" stroke="#E0882F" stroke-width="18" stroke-linecap="round"/>
  <line x1="826" y1="612" x2="938" y2="516" stroke="#E0882F" stroke-width="18" stroke-linecap="round"/>
  <line x1="910" y1="612" x2="1022" y2="516" stroke="#F3CF9F" stroke-width="18" stroke-linecap="round"/>
  <text x="664" y="714" fill="#6D6257" font-family="Inter, Arial, sans-serif" font-size="22">Queries often attend along relative-position bands.</text>
  <text x="664" y="748" fill="#6D6257" font-family="Inter, Arial, sans-serif" font-size="22">That is why slash-like structure preserves local behavior.</text>

  <rect x="72" y="888" width="1056" height="404" rx="34" fill="#F4F8FF" stroke="#D5E3FF"/>
  <text x="108" y="948" fill="#2345B8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">CRA = Cumulative Residual Attention</text>
  <text x="108" y="1000" fill="#1E1E1E" font-family="Inter, Arial, sans-serif" font-size="30">Defined as the minimum remaining attention probability mass</text>
  <text x="108" y="1042" fill="#1E1E1E" font-family="Inter, Arial, sans-serif" font-size="30">per query after sparsification.</text>
  <rect x="108" y="1086" width="984" height="144" rx="24" fill="#FFFFFF" stroke="#DCE7FF"/>
  <rect x="140" y="1138" width="360" height="18" rx="9" fill="#E5EDFF"/>
  <rect x="140" y="1138" width="270" height="18" rx="9" fill="#3B6BF2"/>
  <text x="526" y="1154" fill="#607088" font-family="Inter, Arial, sans-serif" font-size="20">higher retained mass</text>
  <text x="140" y="1206" fill="#44506A" font-family="Inter, Arial, sans-serif" font-size="22">Why it matters: CRA is a runtime proxy for whether the sparse mask kept enough useful attention.</text>
  <text x="140" y="1240" fill="#44506A" font-family="Inter, Arial, sans-serif" font-size="22">SampleAttention approximates it with chunked query sampling, then picks top-k column and slash blocks.</text>

  <text x="72" y="1412" fill="#6A6A6A" font-family="Inter, Arial, sans-serif" font-size="22">Slide 3 of 4</text>
  <text x="930" y="1412" fill="#6A6A6A" font-family="Inter, Arial, sans-serif" font-size="22">zhanyl-tech.github.io</text>
</svg>
