<svg width="1200" height="1500" viewBox="0 0 1200 1500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="1500" fill="#FFFFFF"/>

  <!-- header band -->
  <rect width="1200" height="140" fill="#4A148C"/>
  <text x="60" y="72" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">SAMPLEATTENTION · SPARSE PATTERNS + CRA</text>
  <text x="60" y="112" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="700">Two Shapes in Every Attention Map</text>

  <text x="60" y="184" fill="#333333" font-family="Inter,Arial,sans-serif" font-size="26">Real attention during prefill is not random — the same two patterns appear across heads and models.</text>

  <!-- FULL attention map reference -->
  <text x="60" y="244" fill="#111111" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">What a real prefill attention map looks like (12 tokens × 12 tokens):</text>

  <!-- 12x12 attention heatmap -->
  <!-- dense causal mask: lower-left triangle, with column and slash highlights -->
  <g>
    <!-- row 1 -->
    <rect x="60"  y="260" width="38" height="38" rx="4" fill="#9C27B0" opacity="0.8"/>
    <!-- row 2 -->
    <rect x="60"  y="304" width="38" height="38" rx="4" fill="#9C27B0" opacity="0.6"/>
    <rect x="104" y="304" width="38" height="38" rx="4" fill="#CE93D8" opacity="0.9"/>
    <!-- row 3 -->
    <rect x="60"  y="348" width="38" height="38" rx="4" fill="#9C27B0" opacity="0.6"/>
    <rect x="104" y="348" width="38" height="38" rx="4" fill="#E1BEE7" opacity="0.4"/>
    <rect x="148" y="348" width="38" height="38" rx="4" fill="#CE93D8" opacity="0.9"/>
    <!-- row 4 -->
    <rect x="60"  y="392" width="38" height="38" rx="4" fill="#9C27B0" opacity="0.6"/>
    <rect x="104" y="392" width="38" height="38" rx="4" fill="#E1BEE7" opacity="0.3"/>
    <rect x="148" y="392" width="38" height="38" rx="4" fill="#E1BEE7" opacity="0.3"/>
    <rect x="192" y="392" width="38" height="38" rx="4" fill="#CE93D8" opacity="0.9"/>
    <!-- row 5 -->
    <rect x="60"  y="436" width="38" height="38" rx="4" fill="#9C27B0" opacity="0.6"/>
    <rect x="104" y="436" width="38" height="38" rx="4" fill="#E1BEE7" opacity="0.2"/>
    <rect x="148" y="436" width="38" height="38" rx="4" fill="#E1BEE7" opacity="0.2"/>
    <rect x="192" y="436" width="38" height="38" rx="4" fill="#E1BEE7" opacity="0.2"/>
    <rect x="236" y="436" width="38" height="38" rx="4" fill="#CE93D8" opacity="0.9"/>
    <!-- row 6 -->
    <rect x="60"  y="480" width="38" height="38" rx="4" fill="#9C27B0" opacity="0.6"/>
    <rect x="104" y="480" width="38" height="38" rx="4" fill="#E1BEE7" opacity="0.2"/>
    <rect x="148" y="480" width="38" height="38" rx="4" fill="#E1BEE7" opacity="0.2"/>
    <rect x="192" y="480" width="38" height="38" rx="4" fill="#E1BEE7" opacity="0.2"/>
    <rect x="236" y="480" width="38" height="38" rx="4" fill="#E1BEE7" opacity="0.2"/>
    <rect x="280" y="480" width="38" height="38" rx="4" fill="#CE93D8" opacity="0.9"/>
    <!-- row 7 -->
    <rect x="60"  y="524" width="38" height="38" rx="4" fill="#9C27B0" opacity="0.6"/>
    <rect x="104" y="524" width="38" height="38" rx="4" fill="#E1BEE7" opacity="0.1"/>
    <rect x="148" y="524" width="38" height="38" rx="4" fill="#E1BEE7" opacity="0.1"/>
    <rect x="192" y="524" width="38" height="38" rx="4" fill="#E1BEE7" opacity="0.1"/>
    <rect x="236" y="524" width="38" height="38" rx="4" fill="#E1BEE7" opacity="0.1"/>
    <rect x="280" y="524" width="38" height="38" rx="4" fill="#E1BEE7" opacity="0.1"/>
    <rect x="324" y="524" width="38" height="38" rx="4" fill="#CE93D8" opacity="0.9"/>
  </g>

  <!-- overlay box labels: col stripe -->
  <rect x="59" y="259" width="40" height="312" rx="4" fill="#7B1FA2" opacity="0.8"/>
  <text x="79" y="430" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle" transform="rotate(-90,79,430)">COLUMN STRIPE (sink)</text>

  <!-- diagonal label -->
  <rect x="104" y="304" width="40" height="40" rx="4" fill="#9C27B0" opacity="0.0"/>
  <line x1="104" y1="570" x2="362" y2="258" stroke="#E040FB" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="370" y="256" fill="#AA00FF" font-family="Inter,Arial,sans-serif" font-size="18">SLASH pattern</text>

  <!-- Pattern explanations side by side -->
  <rect x="640" y="244" width="250" height="362" rx="20" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
  <rect x="640" y="244" width="250" height="52" rx="20" fill="#9C27B0"/>
  <rect x="640" y="272" width="250" height="24" fill="#9C27B0"/>
  <text x="765" y="278" fill="#FFF" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">COLUMN</text>

  <text x="665" y="330" fill="#4A148C" font-family="Inter,Arial,sans-serif" font-size="19">• Certain tokens attract</text>
  <text x="665" y="356" fill="#4A148C" font-family="Inter,Arial,sans-serif" font-size="19">  high attention from</text>
  <text x="665" y="382" fill="#4A148C" font-family="Inter,Arial,sans-serif" font-size="19">  almost every query.</text>
  <text x="665" y="420" fill="#4A148C" font-family="Inter,Arial,sans-serif" font-size="19">• Semantics: global</text>
  <text x="665" y="446" fill="#4A148C" font-family="Inter,Arial,sans-serif" font-size="19">  anchors (delimiters,</text>
  <text x="665" y="472" fill="#4A148C" font-family="Inter,Arial,sans-serif" font-size="19">  special tokens, etc.)</text>
  <text x="665" y="510" fill="#7B1FA2" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600">Identified by sampling</text>
  <text x="665" y="534" fill="#7B1FA2" font-family="Inter,Arial,sans-serif" font-size="17">a few Q rows first.</text>
  <text x="665" y="576" fill="#7B1FA2" font-family="Inter,Arial,sans-serif" font-size="17">Per-head, per-layer.</text>

  <rect x="910" y="244" width="250" height="362" rx="20" fill="#EDE7F6" stroke="#673AB7" stroke-width="2"/>
  <rect x="910" y="244" width="250" height="52" rx="20" fill="#673AB7"/>
  <rect x="910" y="272" width="250" height="24" fill="#673AB7"/>
  <text x="1035" y="278" fill="#FFF" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">SLASH</text>

  <text x="935" y="330" fill="#311B92" font-family="Inter,Arial,sans-serif" font-size="19">• Each query attends to</text>
  <text x="935" y="356" fill="#311B92" font-family="Inter,Arial,sans-serif" font-size="19">  tokens near itself in</text>
  <text x="935" y="382" fill="#311B92" font-family="Inter,Arial,sans-serif" font-size="19">  the sequence.</text>
  <text x="935" y="420" fill="#311B92" font-family="Inter,Arial,sans-serif" font-size="19">• Semantics: local</text>
  <text x="935" y="446" fill="#311B92" font-family="Inter,Arial,sans-serif" font-size="19">  continuity / context</text>
  <text x="935" y="472" fill="#311B92" font-family="Inter,Arial,sans-serif" font-size="19">  window.</text>
  <text x="935" y="510" fill="#4527A0" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600">Fixed diagonal band.</text>
  <text x="935" y="534" fill="#4527A0" font-family="Inter,Arial,sans-serif" font-size="17">Width tuned by CRA.</text>
  <text x="935" y="576" fill="#4527A0" font-family="Inter,Arial,sans-serif" font-size="17">No profiling needed.</text>

  <!-- CRA SECTION -->
  <rect x="60" y="660" width="1080" height="380" rx="24" fill="#FFF8E1" stroke="#F57F17" stroke-width="2"/>
  <rect x="60" y="660" width="1080" height="60" rx="24" fill="#F57F17"/>
  <rect x="60" y="694" width="1080" height="26" fill="#F57F17"/>
  <text x="100" y="702" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">CRA — Cumulative Residual Attention</text>

  <!-- CRA definition visual -->
  <text x="100" y="766" fill="#E65100" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">What it measures:</text>
  <text x="100" y="800" fill="#4E342E" font-family="Inter,Arial,sans-serif" font-size="20">The fraction of total attention mass retained by the chosen sparse mask.</text>

  <!-- Bar chart visualizing CRA for different budgets -->
  <text x="100" y="848" fill="#E65100" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="600">Sparse mask keeps this % of total attention:</text>

  <!-- budget bars -->
  <rect x="100" y="864" width="800" height="22" rx="11" fill="#FFE0B2"/>
  <rect x="100" y="864" width="720" height="22" rx="11" fill="#F57F17"/>
  <text x="828" y="881" fill="#555" font-family="Inter,Arial,sans-serif" font-size="16">90% retained</text>

  <rect x="100" y="896" width="800" height="22" rx="11" fill="#FFE0B2"/>
  <rect x="100" y="896" width="600" height="22" rx="11" fill="#FF9800"/>
  <text x="708" y="913" fill="#555" font-family="Inter,Arial,sans-serif" font-size="16">75% retained</text>

  <rect x="100" y="928" width="800" height="22" rx="11" fill="#FFE0B2"/>
  <rect x="100" y="928" width="480" height="22" rx="11" fill="#FFC107"/>
  <text x="588" y="945" fill="#555" font-family="Inter,Arial,sans-serif" font-size="16">60% retained</text>

  <text x="100" y="862" fill="#4E342E" font-family="Inter,Arial,sans-serif" font-size="17">←──────────── CRA threshold set here ────────────→</text>

  <text x="100" y="988" fill="#4E342E" font-family="Inter,Arial,sans-serif" font-size="20">Why it predicts accuracy: if you keep 90% of attention mass, the softmax output barely moves.</text>
  <text x="100" y="1016" fill="#4E342E" font-family="Inter,Arial,sans-serif" font-size="20">Approximated at runtime by sampling a few Q rows — no offline profiling, no fixed budget.</text>

  <!-- takeaways -->
  <rect x="60" y="1070" width="1080" height="200" rx="20" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/>
  <text x="100" y="1114" fill="#0D47A1" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">Mental Model: Three Takeaways</text>
  <text x="100" y="1158" fill="#1565C0" font-family="Inter,Arial,sans-serif" font-size="22">① Attention sparsity is structured. Two patterns win. Fine-grained sparsity doesn't scale to kernels.</text>
  <text x="100" y="1198" fill="#1565C0" font-family="Inter,Arial,sans-serif" font-size="22">② Use sparse mechanisms that match your bottleneck (block-skip for prefill, page-select for decode).</text>
  <text x="100" y="1238" fill="#1565C0" font-family="Inter,Arial,sans-serif" font-size="22">③ CRA gives you a quality signal for free — threshold it, don't fix token budgets statically.</text>

  <!-- bottom bar -->
  <rect x="0" y="1438" width="1200" height="62" fill="#F5F5F5"/>
  <text x="60" y="1477" fill="#888888" font-family="Inter,Arial,sans-serif" font-size="20">Slide 4 of 4</text>
  <text x="870" y="1477" fill="#888888" font-family="Inter,Arial,sans-serif" font-size="20">zhanyl-tech.github.io</text>
</svg>
