<svg width="1200" height="1500" viewBox="0 0 1200 1500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="1500" fill="#F8FAFF"/>
  <text x="72" y="112" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="700">What I Would Keep</text>
  <text x="72" y="178" fill="#111111" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="700">from Both Papers</text>
  <text x="72" y="246" fill="#5F6672" font-family="Inter, Arial, sans-serif" font-size="28">A production-focused mental model for long-context inference.</text>

  <rect x="72" y="316" width="1056" height="204" rx="30" fill="#FFFFFF" stroke="#E7EBF6"/>
  <rect x="104" y="356" width="78" height="78" rx="22" fill="#F4F1EA"/>
  <text x="133" y="406" fill="#7A5C1E" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">1</text>
  <text x="218" y="386" fill="#202020" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="700">Prefill and decode are different optimization problems.</text>
  <text x="218" y="434" fill="#59606D" font-family="Inter, Arial, sans-serif" font-size="24">If the bottlenecks differ, the sparse mechanism should differ too.</text>

  <rect x="72" y="566" width="1056" height="204" rx="30" fill="#FFFFFF" stroke="#E7EBF6"/>
  <rect x="104" y="606" width="78" height="78" rx="22" fill="#EEF3FF"/>
  <text x="133" y="656" fill="#2A4EBB" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">2</text>
  <text x="218" y="636" fill="#202020" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="700">The best sparse patterns are structured, not arbitrary.</text>
  <text x="218" y="684" fill="#59606D" font-family="Inter, Arial, sans-serif" font-size="24">Columns preserve global anchors. Slashes preserve local continuity.</text>

  <rect x="72" y="816" width="1056" height="204" rx="30" fill="#FFFFFF" stroke="#E7EBF6"/>
  <rect x="104" y="856" width="78" height="78" rx="22" fill="#FFF6EA"/>
  <text x="133" y="906" fill="#BA6814" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">3</text>
  <text x="218" y="886" fill="#202020" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="700">Accuracy needs a runtime control signal.</text>
  <text x="218" y="934" fill="#59606D" font-family="Inter, Arial, sans-serif" font-size="24">CRA is better than a fixed sparsity ratio or offline pattern choice.</text>

  <rect x="72" y="1076" width="1056" height="252" rx="34" fill="#111111"/>
  <text x="110" y="1156" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700">Bottom line</text>
  <text x="110" y="1216" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="30">SampleAttention tells you what to keep during prefill.</text>
  <text x="110" y="1260" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="30">LServe tells you how to serve sparse attention across prefill and decode.</text>

  <text x="72" y="1412" fill="#6A6A6A" font-family="Inter, Arial, sans-serif" font-size="22">Slide 4 of 4</text>
  <text x="930" y="1412" fill="#6A6A6A" font-family="Inter, Arial, sans-serif" font-size="22">zhanyl-tech.github.io</text>
</svg>
