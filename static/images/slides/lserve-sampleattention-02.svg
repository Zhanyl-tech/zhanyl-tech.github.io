<svg width="1200" height="1500" viewBox="0 0 1200 1500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="1500" fill="#FFFFFF"/>

  <!-- header band -->
  <rect width="1200" height="140" fill="#1A2B6D"/>
  <text x="60" y="72" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">LSERVE · PREFILL PHASE</text>
  <text x="60" y="112" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="50" font-weight="700">Block-Sparse + Streaming Heads</text>

  <text x="60" y="184" fill="#333333" font-family="Inter,Arial,sans-serif" font-size="26">Goal: reduce sequential KV-block iterations when processing many query tokens at once.</text>

  <!-- SECTION A: dense vs block-sparse -->
  <rect x="60" y="220" width="1080" height="500" rx="24" fill="#F8F9FF" stroke="#4285F4" stroke-width="2"/>
  <rect x="60" y="220" width="1080" height="56" rx="24" fill="#4285F4"/>
  <rect x="60" y="252" width="1080" height="24" fill="#4285F4"/>
  <text x="100" y="258" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">Block-Sparse Attention</text>

  <text x="100" y="314" fill="#1A237E" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">DENSE (before LServe)</text>

  <!-- dense grid 8x8 -->
  <g>
    <rect x="100" y="330" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="134" y="330" width="28" height="28" rx="4" fill="#4285F4"/>
