    <rect x="724" y="330" width="28" height="28" rx="4" fill="#BBDEFB"/>
    <rect x="758" y="330" width="28" height="28" rx="4" fill="#4285F4"/>

    <rect x="520" y="364" width="28" height="28" rx="4" fill="#BBDEFB"/>
    <rect x="554" y="364" width="28" height="28" rx="4" fill="#BBDEFB"/>
    <rect x="588" y="364" width="28" height="28" rx="4" fill="#BBDEFB"/>
    <rect x="622" y="364" width="28" height="28" rx="4" fill="#4285F4"/>
