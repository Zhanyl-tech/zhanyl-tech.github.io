    <rect x="724" y="364" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="758" y="364" width="28" height="28" rx="4" fill="#4285F4"/>

    <rect x="520" y="398" width="28" height="28" rx="4" fill="#BBDEFB"/>
    <rect x="554" y="398" width="28" height="28" rx="4" fill="#BBDEFB"/>
    <rect x="588" y="398" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="622" y="398" width="28" height="28" rx="4" fill="#BBDEFB"/>
    <rect x="656" y="398" width="28" height="28" rx="4" fill="#BBDEFB"/>
    <rect x="690" y="398" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="724" y="398" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="758" y="398" width="28" height="28" rx="4" fill="#4285F4"/>

    <rect x="520" y="432" width="28" height="28" rx="4" fill="#BBDEFB"/>
    <rect x="554" y="432" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="588" y="432" width="28" height="28" rx="4" fill="#BBDEFB"/>
    <rect x="622" y="432" width="28" height="28" rx="4" fill="#BBDEFB"/>
    <rect x="656" y="432" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="690" y="432" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="724" y="432" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="758" y="432" width="28" height="28" rx="4" fill="#4285F4"/>
  </g>
  <rect x="800" y="330" width="20" height="20" rx="4" fill="#4285F4"/>
  <text x="826" y="346" fill="#444" font-family="Inter,Arial,sans-serif" font-size="16">Computed</text>
  <rect x="800" y="358" width="20" height="20" rx="4" fill="#BBDEFB"/>
  <text x="826" y="374" fill="#444" font-family="Inter,Arial,sans-serif" font-size="16">Skipped</text>
  <text x="520" y="484" fill="#1565C0" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">~60-70% fewer blocks — measurable speedup</text>

  <!-- SECTION B: Dense vs Streaming heads -->
  <rect x="60" y="750" width="1080" height="430" rx="24" fill="#FFF3E0" stroke="#F9A825" stroke-width="2"/>
  <rect x="60" y="750" width="1080" height="56" rx="24" fill="#F9A825"/>
  <rect x="60" y="782" width="1080" height="24" fill="#F9A825"/>
  <text x="100" y="788" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">Streaming Heads (Static Sparsity)</text>

  <!-- Dense head diagram -->
  <rect x="100" y="836" width="390" height="290" rx="20" fill="#FFFFFF" stroke="#FFD54F"/>
  <text x="260" y="874" fill="#E65100" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">Dense Head</text>
  <!-- full triangle -->
  <polygon points="140,950 380,950 380,1090 140,1090" fill="#FFD54F" opacity="0.3"/>
  <polygon points="140,950 380,1090 140,1090" fill="#FFA726" opacity="0.6"/>
  <text x="260" y="1040" fill="#555" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle">Full KV attention</text>
  <text x="260" y="1070" fill="#555" font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">O(n²) cost</text>

  <!-- arrow -->
  <path d="M490 970H660" stroke="#555555" stroke-width="6" stroke-linecap="round"/>
  <path d="M644 954L670 970L644 986" stroke="#555555" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="516" y="950" width="116" height="36" rx="18" fill="#E65100"/>
  <text x="574" y="974" fill="#FFF" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">50% heads</text>

  <!-- Streaming head diagram -->
  <rect x="680" y="836" width="390" height="290" rx="20" fill="#FFFFFF" stroke="#FFD54F"/>
  <text x="875" y="874" fill="#E65100" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle">Streaming Head (Λ-mask)</text>
  <!-- Λ shaped area: recent tokens + initial tokens -->
  <rect x="720" y="950" width="60" height="140" rx="6" fill="#FFA726" opacity="0.8"/>
  <text x="750" y="1010" fill="#FFF" font-family="Inter,Arial,sans-serif" font-size="14" text-anchor="middle">Sink</text>
  <polygon points="800,950 1030,950 1030,1090" fill="#FFA726" opacity="0.3"/>
  <polygon points="980,1000 1030,950 1030,1090 980,1090" fill="#FFA726" opacity="0.8"/>
  <text x="875" y="1040" fill="#555" font-family="Inter,Arial,sans-serif" font-size="18" text-anchor="middle">Sink + recent window</text>
  <text x="875" y="1070" fill="#1B5E20" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="middle">~free — nearly no compute</text>

  <!-- bottom bar -->
  <rect x="0" y="1438" width="1200" height="62" fill="#F5F5F5"/>
  <text x="60" y="1477" fill="#888888" font-family="Inter,Arial,sans-serif" font-size="20">Slide 2 of 4</text>
  <text x="870" y="1477" fill="#888888" font-family="Inter,Arial,sans-serif" font-size="20">zhanyl-tech.github.io</text>
</svg>
