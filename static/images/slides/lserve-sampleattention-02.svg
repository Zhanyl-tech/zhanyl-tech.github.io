    <rect x="304" y="330" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="338" y="330" width="28" height="28" rx="4" fill="#4285F4"/>

    <rect x="100" y="364" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="134" y="364" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="168" y="364" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="202" y="364" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="236" y="364" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="270" y="364" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="304" y="364" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="338" y="364" width="28" height="28" rx="4" fill="#4285F4"/>

    <rect x="100" y="398" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="134" y="398" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="168" y="398" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="202" y="398" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="236" y="398" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="270" y="398" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="304" y="398" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="338" y="398" width="28" height="28" rx="4" fill="#4285F4"/>

    <rect x="100" y="432" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="134" y="432" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="168" y="432" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="202" y="432" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="236" y="432" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="270" y="432" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="304" y="432" width="28" height="28" rx="4" fill="#4285F4"/>
    <rect x="338" y="432" width="28" height="28" rx="4" fill="#4285F4"/>
  </g>
  <text x="100" y="484" fill="#555555" font-family="Inter,Arial,sans-serif" font-size="18">Every block computed — slow at long context</text>

  <!-- arrow -->
  <path d="M420 410H510" stroke="#333333" stroke-width="6" stroke-linecap="round"/>
  <path d="M494 394L518 410L494 426" stroke="#333333" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="520" y="314" fill="#1A237E" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">BLOCK-SPARSE (LServe)</text>

  <!-- sparse grid 8x8 -->
  <g>
    <!-- row 1: mostly skipped -->
    <rect x="520" y="330" width="28" height="28" rx="4" fill="#BBDEFB"/>
    <rect x="554" y="330" width="28" height="28" rx="4" fill="#BBDEFB"/>
    <rect x="588" y="330" width="28" height="28" rx="4" fill="#BBDEFB"/>
    <rect x="622" y="330" width="28" height="28" rx="4" fill="#BBDEFB"/>
