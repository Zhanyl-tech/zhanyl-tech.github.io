<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#222"/>
    </marker>
  </defs>
  <style type="text/css"><![CDATA[
    .lab { font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #111; }
    .sub { font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #444; font-size: 12px; }
    .box { fill: #fafafa; stroke: #222; stroke-width: 1.2; }
    .box-em { fill: #e8eef6; stroke: #222; stroke-width: 1.2; }
  ]]></style>
  <rect width="900" height="300" fill="#ffffff"/>
  <text x="24" y="26" class="lab" font-size="14" font-weight="700">Figure 2</text>
  <text x="24" y="44" class="sub">LServe decode: hierarchical KV-page selection - coarse scoring over all pages, then dense attention only inside the selected subset (per step; selection may be reused across nearby steps).</text>

  <g transform="translate(40, 78)">
    <text x="0" y="0" class="lab" font-size="12" font-weight="600">KV cache (pages)</text>
    <g transform="translate(0, 12)">
      <rect class="box" x="0" y="0" width="32" height="24" rx="2"/><rect class="box" x="36" y="0" width="32" height="24" rx="2"/><rect class="box" x="72" y="0" width="32" height="24" rx="2"/><rect class="box" x="108" y="0" width="32" height="24" rx="2"/><rect class="box" x="144" y="0" width="32" height="24" rx="2"/>
      <rect class="box" x="0" y="28" width="32" height="24" rx="2"/><rect class="box" x="36" y="28" width="32" height="24" rx="2"/><rect class="box" x="72" y="28" width="32" height="24" rx="2"/><rect class="box" x="108" y="28" width="32" height="24" rx="2"/><rect class="box" x="144" y="28" width="32" height="24" rx="2"/>
    </text>
  </g>

  <path d="M 230 118 L 268 118" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect class="box-em" x="278" y="88" width="168" height="72" rx="4"/>
  <text x="362" y="118" text-anchor="middle" class="lab" font-size="12" font-weight="700">Coarse stage</text>
  <text x="362" y="136" text-anchor="middle" class="sub">summary: query vs page</text>
  <text x="362" y="152" text-anchor="middle" class="sub">vector score (cheap)</text>

  <path d="M 454 124 L 492 124" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect class="box-em" x="502" y="88" width="168" height="72" rx="4"/>
  <text x="586" y="118" text-anchor="middle" class="lab" font-size="12" font-weight="700">Top-k pages</text>
  <text x="586" y="136" text-anchor="middle" class="sub">constant-ish k</text>
  <text x="586" y="152" text-anchor="middle" class="sub">vs context length</text>

  <path d="M 678 124 L 716 124" stroke="#222" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect class="box" x="726" y="88" width="134" height="72" rx="4"/>
  <text x="793" y="118" text-anchor="middle" class="lab" font-size="12" font-weight="700">Fine stage</text>
  <text x="793" y="136" text-anchor="middle" class="sub">token-level</text>
  <text x="793" y="152" text-anchor="middle" class="sub">attention</text>

  <text x="40" y="210" class="sub">Optional stack (not shown to scale): INT4 KV quantization reduces bytes per page read in parallel with page pruning.</text>
</svg>
