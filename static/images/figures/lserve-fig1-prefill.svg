<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340">
  <defs>
    <style type="text/css"><![CDATA[
      .lab { font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #111; }
      .sub { font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #444; font-size: 12px; }
      .pan { font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #000; font-size: 13px; font-weight: 700; }
      .blk-on { fill: #c8d6e8; stroke: #222; stroke-width: 1.5; }
      .blk-off { fill: #f4f4f4; stroke: #bbb; stroke-width: 1; stroke-dasharray: 3 2; }
    ]]></style>
  </defs>
  <rect width="900" height="340" fill="#ffffff"/>
  <text x="24" y="28" class="lab" font-size="14" font-weight="700">Figure 1</text>
  <text x="24" y="46" class="sub">LServe prefill: (a) block-sparse mask - entire KV blocks retained or dropped; (b) streaming head with Lambda-shaped support (sink + local window).</text>

  <text x="44" y="88" class="pan">(a) Block-sparse</text>
  <text x="44" y="106" class="sub">Query-key block tiling; skipped blocks are not loaded.</text>
  <g transform="translate(44,118)">
    <text x="0" y="-6" class="sub" font-size="10">KV blocks along sequence</text>
    <rect class="blk-on" x="0" y="8" width="36" height="28" rx="3"/>
    <rect class="blk-off" x="40" y="8" width="36" height="28" rx="3"/>
    <rect class="blk-on" x="80" y="8" width="36" height="28" rx="3"/>
    <rect class="blk-off" x="120" y="8" width="36" height="28" rx="3"/>
    <rect class="blk-off" x="160" y="8" width="36" height="28" rx="3"/>
    <rect class="blk-on" x="200" y="8" width="36" height="28" rx="3"/>
    <rect class="blk-off" x="240" y="8" width="36" height="28" rx="3"/>
    <rect class="blk-on" x="280" y="8" width="36" height="28" rx="3"/>
    <rect x="0" y="48" width="14" height="14" class="blk-on"/>
    <text x="20" y="59" class="sub" font-size="11">computed</text>
    <rect x="0" y="68" width="14" height="14" class="blk-off"/>
    <text x="20" y="79" class="sub" font-size="11">skipped</text>
  </g>

  <text x="480" y="88" class="pan">(b) Streaming head (Lambda-mask)</text>
  <text x="480" y="106" class="sub">Attention mass restricted to sink tokens and a trailing window.</text>
  <g transform="translate(480,118)">
    <line x1="0" y1="100" x2="360" y2="100" stroke="#222" stroke-width="1.2"/>
    <text x="0" y="118" class="sub" font-size="10">sequence position increases</text>
    <rect x="4" y="52" width="28" height="44" fill="#b8c9e0" stroke="#222" stroke-width="1.2" rx="2"/>
    <text x="18" y="78" class="sub" font-size="9" text-anchor="middle">sink</text>
    <polygon points="48,96 340,96 340,52 48,52" fill="#e8eef6" stroke="#222" stroke-width="1.2"/>
    <text x="190" y="78" class="sub" font-size="11" text-anchor="middle">recent window</text>
    <text x="190" y="94" class="sub" font-size="10" text-anchor="middle">(middle region omitted)</text>
  </g>
</svg>
