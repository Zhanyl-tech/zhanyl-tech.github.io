<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" width="820" height="360">
  <style type="text/css"><![CDATA[
    .lab { font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #111; }
    .sub { font-family: system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #444; font-size: 12px; }
    .cell { fill: #f0f0f0; stroke: #ccc; stroke-width: 0.8; }
    .cell-hi { fill: #d0dce8; stroke: #222; stroke-width: 1; }
