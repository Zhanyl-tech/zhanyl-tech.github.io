  <rect width="820" height="360" fill="#ffffff"/>
  <text x="24" y="26" class="lab" font-size="14" font-weight="700">Figure 3</text>
  <text x="24" y="44" class="sub">SampleAttention: dominant structured mass in prefill maps (schematic): column-heavy keys and a near-diagonal band. Darker = larger relative mass.</text>

  <text x="48" y="88" class="lab" font-size="12" font-weight="600">Attention matrix (causal, schematic)</text>
  <text x="48" y="104" class="sub" font-size="11">Rows: queries; columns: keys</text>

  <g transform="translate(48, 118)">
    <!-- 10x10 lower causal -->
