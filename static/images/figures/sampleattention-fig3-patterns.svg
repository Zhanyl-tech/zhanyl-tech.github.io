  <rect x="46" y="116" width="26" height="242" fill="none" stroke="#1a365d" stroke-width="2" opacity="0.85"/>
  <text x="58" y="112" class="sub" font-size="10" text-anchor="middle">column</text>

  <line x1="70" y1="350" x2="280" y2="130" stroke="#c53030" stroke-width="2" stroke-dasharray="5 3" opacity="0.9"/>
  <text x="290" y="128" class="sub" font-size="11" fill="#822">local band</text>

  <text x="400" y="140" class="lab" font-size="12" font-weight="600">Column pattern</text>
  <text x="400" y="158" class="sub">High mass on a few key columns (sinks, specials).</text>
  <text x="400" y="174" class="sub">Preserves global context shared across queries.</text>
  <text x="400" y="204" class="lab" font-size="12" font-weight="600">Diagonal / slash band</text>
  <text x="400" y="222" class="sub">Local continuity: mass near the causal diagonal.</text>
  <text x="400" y="238" class="sub">Band width adapts under CRA (Figure 4).</text>
