name: Weekly drop

# The cadence engine. Every Saturday morning this opens an issue with the
# week's checklist, and closes the previous one. GitHub is the system of
# record, so the prompt to publish lives next to the thing being published.
#
# It also reports how long it has been since the last post — an honest number
# is more motivating than a reminder that pretends nothing has slipped.
#
# This workflow cannot publish anything, by construction:
#   - its token can read the repository and write issues, nothing else
#     (contents: read), so it cannot push a commit or merge a pull request;
#   - it never runs a generator (vizpub.py, social.py) and holds no API key;
#   - the checklist it opens points at scripts/weekly.sh, which refuses to run
#     without a terminal, makes you read the post and type its slug, and then
#     pushes a publish/<slug> branch for a pull request, never main.
# Content reaches the site only when a person merges that pull request.

on:
  schedule:
    - cron: "0 13 * * 6" # Saturday 09:00 ET (13:00 UTC)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  open-issue:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to the commit their tag pointed at on 2026-09-26
      # (git ls-remote), so a moved tag cannot change what runs here.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Days since the newest *published post*, read from front matter. The
      # previous version used the last commit touching the content folders, so
      # any edit to an old post reset the count (it reported 48 days when the
      # real figure was 62).
      - name: Measure days since last post
        id: cadence
        run: |
          set -euo pipefail
          DAYS="$(python3 scripts/last_published.py --days)"
          echo "days=${DAYS}" >> "$GITHUB_OUTPUT"
          echo "last=$(python3 scripts/last_published.py)" >> "$GITHUB_OUTPUT"
          echo "week=$(date +'%Y-W%V')" >> "$GITHUB_OUTPUT"

      - name: Open this week's issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DAYS: ${{ steps.cadence.outputs.days }}
          LAST: ${{ steps.cadence.outputs.last }}
          WEEK: ${{ steps.cadence.outputs.week }}
        with:
          script: |
            const { DAYS, LAST, WEEK } = process.env;
            const title = `Weekly drop — ${WEEK}`;
            const since = DAYS === 'unknown'
              ? 'No published post found.'
              : `**${DAYS} days** since the last post (${LAST}).`;

            const body = [
              since,
              '',
              'Pick one. A lab note that ships beats a deep dive that does not.',
              '',
              '| Type | Where | Length |',
              '| --- | --- | --- |',
              '| Deep dive | `content/blog/` | 1500-3000 words |',
              '| Lab note | `content/experiments/` | 500-1500 words |',
              '| Note | `content/notes/` | 100-500 words |',
              '',
              '### Ship it',
              '```bash',
              'hugo new experiments/$(date +%F)-slug.md   # write it, keep draft: true',
              'hugo server -D                             # read it rendered, locally',
              './scripts/weekly.sh content/experiments/<file>.md',
              '```',
              '',
              '`weekly.sh` shows you the post and asks you to type its slug, refuses',
              'a post that still has the vizpub review marker, builds and link-checks',
              'the site, and pushes a `publish/<slug>` branch. Open a pull request;',
              'merging it is what deploys. It also writes LinkedIn/X drafts.',
              '',
              '### Then',
              '- [ ] Pull request merged (site live)',
              '- [ ] LinkedIn — Tue-Thu 8-10 AM ET, native image, link in first comment',
              '- [ ] X thread — Wed 8-10 AM ET, card on tweet 1',
              '- [ ] HN — deep dives only',
              '',
              '---',
              '<sub>Opened automatically by `.github/workflows/weekly-drop.yml`, which cannot publish.</sub>',
            ].join('\n');

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'weekly-drop',
            });

            if (open.data.some(i => i.title === title)) {
              core.info(`${title} already open — nothing to do.`);
              return;
            }

            // Close last week's before opening this week's, so the list stays at one.
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: "Superseded by this week's drop.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['weekly-drop'],
            });
