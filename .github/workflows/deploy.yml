name: Deploy Hugo site to GitHub Pages

# One workflow, two jobs. `build` runs on every pull request and every push:
# it checks the content rules, builds with warnings treated as errors, and
# link-checks the output, so a broken link, a front-matter error or a
# reference to a draft fails before it reaches production. `deploy` runs only
# for pushes to main, and only after `build` passed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.159.0
      # sha256 of hugo_extended_0.159.0_linux-amd64.deb, from the release's
      # hugo_0.159.0_checksums.txt (read 2026-09-26). Pinned here rather than
      # fetched at run time, so a replaced release asset fails the build.
      HUGO_DEB_SHA256: ba6e01c87250cdeb91460d7bef38cf04a9d263b0fcee4e283ad00da1fab03ef8
    steps:
      - name: Install Hugo (checksum verified)
        run: |
          set -euo pipefail
          deb="${{ runner.temp }}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          wget -q -O "$deb" "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          echo "${HUGO_DEB_SHA256}  ${deb}" | sha256sum -c -
          sudo dpkg -i "$deb"

      # Actions are pinned to the commit their tag pointed at on 2026-09-26
      # (git ls-remote), so a moved tag cannot change what runs here.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Content checks
        run: |
          python3 scripts/check_content.py
          python3 scripts/static_diagrams.py --check

      - name: Script tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_URL}" ]; then
            hugo --minify --panicOnWarning --baseURL "${BASE_URL}/"
          else
            hugo --minify --panicOnWarning
          fi

      - name: Link check
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/linkcheck.py public --base-url "${BASE_URL:-https://zhanyl-tech.github.io}/"

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
