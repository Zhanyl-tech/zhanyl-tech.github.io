<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{{/* Google Fonts as a plain stylesheet blocks first paint on a
     third-party origin. Preload it, apply it as print (which does not
     block), then flip to all on load. display=swap in the URL means text
     paints in the fallback immediately either way. */}}
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" media="print" onload="this.media='all';this.onload=null">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"></noscript>

<meta name="theme-color" content="#141a23">
<meta name="color-scheme" content="dark">

<script>
  // The design is dark by construction — PaperMod's light theme fights the
  // stylesheet rather than complementing it, so pin dark before first paint
  // to avoid a white flash.
  try { localStorage.setItem("pref-theme", "dark"); } catch (e) {}
  document.documentElement.classList.add("dark");
  document.addEventListener("DOMContentLoaded", function () {
    document.body.classList.add("dark");
  });
</script>

<style>
  /* Figures in the paper-explainer posts render as SVG on white; keep the
     white plate so the diagrams stay legible against the dark page. */
  .post-content figure.blog-figure { margin: 1.9rem 0; }
  .post-content figure.blog-figure img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
    padding: 14px;
  }
  .post-content figure.blog-figure figcaption { text-align: left; }
</style>
